<html>
<head>
<title>Lists</title>
</head>
<body>
<ol type = "1">
<li>Apple</li>
<li>Banana</li>
<li>Plum</li>
</ol>

<ol type = "1" start="7">
<li>Apple</li>
<li>Banana</li>
<li>Plum</li>
</ol>

<ol type = "1" start="2" reversed>
<p>We directly can't list into reverse number but using <u>reversed</u> attribute we can list the list into reverse<p>
<li>Apple</li>
<li>Banana</li>
<li>Plum</li>
<li>Mango</li>
<li>coconut</li>
</ol>

</body>
</html>
